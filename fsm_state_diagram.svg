<text x="706.6" y="123.9" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#52514E">x3</text>
<path d="M674.2 200.8 L750.9 247.4" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
