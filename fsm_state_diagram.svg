<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 1010 370" role="img">
<title>Moore FSM state diagram of the security system</title>
<desc>Nine-state Moore FSM. S0 goes to S1. S1 waits for enter (x1), S2 waits for a key (x2), S3_latch latches the digits, S3_comp branches on x3 to S5 (match) or S4 (mismatch). S5 goes to S6, which goes to S0 when the code is complete (x4) or to swait otherwise. S4 goes to swait. swait waits for the key to be released, then returns to S2. Each state shows its Moore output.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#898781" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="1010" height="370" fill="white"/>
<path d="M18 180 L56 180" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="36.0" y="166.0" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#52514E">reset</text>
<path d="M122.0 180.0 L186.0 180.0" fill="none" stroke="#898781" stroke-width="1.5" marker-end="url(#arrow)"/>
